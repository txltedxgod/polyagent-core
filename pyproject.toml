[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyagent-core"
version = "0.1.0"
description = "Enterprise-grade autonomous multi-agent orchestration framework with DAG execution graphs, vector memory, and workflow studio"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "txltedxgod", email = "txltedxgod@users.noreply.github.com"}
]
keywords = ["ai", "agents", "llm", "orchestration", "dag", "multi-agent", "workflow"]
dependencies = [
    "pydantic>=2.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]
